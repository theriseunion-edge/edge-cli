name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: e2e
        run: make e2e

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: dist
        run: make dist VERSION="dev-${GITHUB_SHA::12}"
      - name: verify static linux binaries
        run: |
          for arch in amd64 arm64; do
            tmp=$(mktemp -d)
            tar -xzf "dist/edge-cli-dev-${GITHUB_SHA::12}-linux-${arch}.tar.gz" -C "$tmp"
            out=$(file "$tmp/ec")
            echo "linux/${arch}: ${out}"
            echo "$out" | grep -q "statically linked"
            if readelf -d "$tmp/ec" 2>/dev/null | grep -q "(NEEDED)"; then
              echo "ERROR: linux/${arch} binary has dynamic library dependencies" >&2
              readelf -d "$tmp/ec" >&2
              exit 1
            fi
            rm -rf "$tmp"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: edge-cli-dev-${{ github.sha }}
          path: dist/
          if-no-files-found: error
