name: release

on:
  push:
    tags:
      - "v-*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ghcr.io/theriseunion-edge/edge-cli
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: package
        run: make dist VERSION="${TAG}"
      - uses: oras-project/setup-oras@v1
      - name: publish OCI component
        run: |
          echo "${GH_TOKEN}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          args=(dist/component.json:application/vnd.risecloud.component.v1+json "dist/SHA256SUMS:text/plain")
          for f in dist/edge-cli-*.tar.gz; do
            args+=("${f}:application/vnd.risecloud.component.binary.tar+gzip")
          done
          oras push "${REPO}:${TAG}" \
            --artifact-type application/vnd.risecloud.component.v1 \
            --annotation "org.opencontainers.image.version=${TAG}" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${args[@]}"
          oras resolve "${REPO}:${TAG}" > dist/oci-digest.txt
          cat dist/oci-digest.txt
      - name: release notes
        run: |
          export OCI_REFERENCE="${REPO}:${TAG}"
          export OCI_DIGEST="$(cat dist/oci-digest.txt)"
          export CHECKSUMS="$(cat dist/SHA256SUMS)"
          python3 scripts/release-notes.py "${TAG}" > dist/release-notes.md
          cat dist/release-notes.md
      - name: create GitHub release
        run: |
          extra=()
          case "${TAG}" in
            *-alpha*|*-beta*|*-rc*) extra+=(--prerelease) ;;
          esac
          gh release create "${TAG}" \
            dist/edge-cli-*.tar.gz \
            dist/SHA256SUMS \
            --title "EdgeCLI ${TAG}" \
            --notes-file dist/release-notes.md \
            "${extra[@]}"
